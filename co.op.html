const NC_figur = {
  drawDragonMesh(ctx,x,y,size,color,level,time,state){
    // low-poly 8 tri mesh
    const flap = state==='spit' ? Math.sin(time*0.012)*0.9 : state==='inhale' ? -0.4 : Math.sin(time*0.008)*0.3;
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(size/28, size/28);
    // wings
    ctx.fillStyle=color;
    ctx.globalAlpha=0.85;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-18, -8+flap*12); ctx.lineTo(-26, 4); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(18, -8+flap*12); ctx.lineTo(26, 4); ctx.closePath(); ctx.fill();
    // body
    ctx.beginPath(); ctx.moveTo(-6,6); ctx.lineTo(6,6); ctx.lineTo(0,22); ctx.closePath(); ctx.fillStyle=color+'cc'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-10,-4); ctx.lineTo(10,-4); ctx.lineTo(0,-18-level/10); ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill();
    ctx.restore();
  }
};`,"NC_kraft.js":`// NC_kraft.js = Kraft / Feed

  LEBEN: 89,
  getViewRadius: () => 2 + 89/100 + Math.sin(Date.now()*0.001)*0.3,

  TMP: 42,

// terrain = Noise + Σ Drache·cos(θ-θ_d)
function axiomMap(x,y,dragons){
  let v = Math.sin(x*0.02)*Math.cos(y*0.03)*6;
  dragons.forEach(d=>{
    const ang = Math.atan2(y-d.y, x-d.x);
    v += d.level/20 * Math.cos(ang - d.theta);
  });
  return v;
}`,"vec.js":`// vec.js = axis math
