        .ram-grid .c.has{color:var(--gold);background:#0f0f0a}
        .ram-grid .c.pc{background:#2a1a00;color:var(--gold);font-weight:900}
        .ram-grid .c.hl{background:#1a001a;color:var(--pink)}
        .row{display:flex;gap:6px;align-items:center;margin:3px 0;font-size:10px}
        .row .lbl{color:var(--dim);min-width:70px} .row .val{color:var(--gold);font-weight:900}
        .term{background:#000;color:var(--grn);font:11px Consolas,monospace;padding:8px;height:240px;overflow:auto;border:2px solid #000;white-space:pre-wrap}
        .term-in{display:flex;background:#000;border:2px solid #000;border-top:none}
        .term-in span{padding:6px 0 6px 8px;color:var(--gold)}
        .term-in input{flex:1;background:transparent;border:none;color:var(--grn);font:11px Consolas,monospace;padding:6px 8px;outline:none}
        .kaiserbar{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 1fr;gap:4px;margin:6px 0}
        .kaiserbar .k{padding:6px;border:1px solid #1a1a1a;background:#000;text-align:center;font-size:9px;cursor:pointer;transition:0.15s}
        .kaiserbar .k.active{border-color:var(--gold);color:var(--gold);background:#1a1400}
        .kaiserbar .k.drache.active{border-color:var(--red);color:var(--red);background:#1a0000}
        .drachehud{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
        .drachehud .d{padding:4px 8px;border:1px solid #1a1a1a;background:#000;font-size:9px;cursor:pointer}
        .drachehud .d.active{border-color:var(--cyan);color:var(--cyan)}
        .bar{height:6px;background:#000;border:1px solid #222;position:relative;flex:1}
        .bar .fill{position:absolute;left:0;top:0;bottom:0;transition:.3s}
        .linkrow{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-top:2px solid #000}
        .linkrow a{border:2px solid var(--bd);background:#000;padding:3px 7px;font-size:9px;color:var(--dim);text-decoration:none}
        .linkrow a:hover{color:var(--gold);border-color:var(--gold)}
        .tmp-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin:6px 0;background:#000;padding:4px;border:1px solid #1a1a1a}
        .tmp-grid .cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:8px;border:1px solid #111;color:#333;position:relative}
        .tmp-grid .cell.work{background:#050505}
        .tmp-grid .cell.user{background:#1a1400;color:var(--gold);font-weight:900;border-color:var(--gold);box-shadow:0 0 6px #ffd70055}
        .tmp-grid .cell.wonder{background:#001a1a;color:var(--cyan);font-weight:900;border-color:var(--cyan)}
        .tmp-grid .cell.cur{outline:2px solid var(--grn);z-index:1}
        .wonder-box{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
        .wonder-box .wb{width:32px;height:32px;border:1px solid #1a1a1a;background:#000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#333;transition:0.2s}
        .wonder-box .wb.found{border-color:var(--cyan);color:var(--cyan);background:#001a1a;box-shadow:0 0 8px var(--cyan)}
        .erf-bar{height:10px;background:#000;border:1px solid #222;position:relative;margin:4px 0}
        .erf-bar .fill{position:absolute;left:0;top:0;bottom:0;transition:0.5s}
        .vec-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:6px 0;font-size:9px}
        .vec-grid .vi{padding:4px;background:#000;border:1px solid #1a1a1a}
        .vec-grid .vi.ok{border-color:var(--grn);color:var(--grn)}
        .vec-grid .vi.bad{border-color:#333;color:#666}
        .vec-grid .vi.fair{border-color:var(--gold);color:var(--gold);background:#1a1400;grid-column:span 2;text-align:center;font-weight:900}
